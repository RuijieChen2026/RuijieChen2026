<svg xmlns="http://www.w3.org/2000/svg" width="960" height="150" viewBox="0 0 960 150" role="img" aria-labelledby="title desc">
  <title id="title">Tech stack: Python and SQL</title>
  <desc id="desc">Two orange cards showing Python and SQL.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1814"/><stop offset="1" stop-color="#281b13"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb067"/><stop offset="1" stop-color="#ff7a24"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="150" rx="18" fill="url(#background)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g><rect x="80" y="25" width="370" height="100" rx="16" fill="#302219" stroke="#7b4a2d" stroke-width="2"/><rect x="104" y="45" width="60" height="60" rx="14" fill="url(#accent)" filter="url(#glow)"/><text x="134" y="82" text-anchor="middle" fill="#28190e" font-size="23" font-weight="700">Py</text><text x="190" y="84" fill="#ffe4cb" font-size="25" font-weight="700">Python</text></g>
    <g><rect x="510" y="25" width="370" height="100" rx="16" fill="#302219" stroke="#7b4a2d" stroke-width="2"/><rect x="534" y="45" width="60" height="60" rx="14" fill="url(#accent)" filter="url(#glow)"/><text x="564" y="81" text-anchor="middle" fill="#28190e" font-size="17" font-weight="700">SQL</text><text x="620" y="84" fill="#ffe4cb" font-size="25" font-weight="700">SQL</text></g>
  </g>
</svg>
